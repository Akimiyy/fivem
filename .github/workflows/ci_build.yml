name: CI Build all products

on:
  workflow_call:
  workflow_dispatch:

permissions:
  packages: read

jobs:
  build_all:
    strategy:
      fail-fast: false
      matrix:
        builds:
          - [ FiveM,  five,   windows ]
          - [ RedM,   rdr3,   windows ]
          - [ Server, server, windows ]
          - [ Server, server, linux   ]
    name: ${{ matrix.builds[0] }}${{ matrix.builds[2] == 'linux' && ' (Linux)' || '' }}
    runs-on: ${{ matrix.builds[2] == 'windows' && 'windows-latest' || 'ubuntu-24.04' }}
    env:
      PROGRAM: ${{ matrix.builds[1] }}
      PLATFORM: ${{ matrix.builds[2] }}      
    steps:
      - name: Checkout
        shell: bash
        run: |          
          [[ $PLATFORM = windows ]] && ROOT="C:\b" || ROOT=~/b
          ROOT_REPO="$ROOT/$PROGRAM"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all);
          
          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"
          
          mkdir -p "$ROOT_REPO" && cd "$_" || exit 1
          
          git init .
          git config core.symlinks true
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_URL="${{ github.event.pull_request.head.repo.clone_url }}"
            TARGET_REF="${{ github.event.pull_request.head.ref }}"
          else
            TARGET_URL="${{ github.server_url }}/${{ github.repository }}.git"
            TARGET_REF="${{ github.ref_name }}"
          fi
          
          git remote add origin "$TARGET_URL"
          git pull origin "$TARGET_REF"
          git submodule update --jobs=$JOB_SLOTS --init --recursive
        
      - name: Dependencies
        shell: bash
        run: |
          mkdir -p "$ROOT_DEP" && cd "$_" || exit 1
      
      - name: Log in to the Container registry
        if: ${{ matrix.builds[2] == 'linux' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        shell: bash
        run: |
          cd "$ROOT_REPO"
          
          export CONFIG_DOCKER_IMAGE="ghcr.io/citizenfx/fivem/fivem-builder-linux-alpine:latest"
          
          BUILD_SCRIPT=".github/workflows/ci/build_$PLATFORM.sh"
          PLATFORM= 
          
          chmod +x "$BUILD_SCRIPT"
          $BUILD_SCRIPT "$ROOT_DEP" $JOB_SLOTS
